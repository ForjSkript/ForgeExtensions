<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/png"
      href="https://avatars.githubusercontent.com/u/257225591?v=4"
    />
    <title>ForgeExtensions</title>
    <meta name="description" content="List of extensions for ForgeScript." />
    <meta name="author" content="ForjSkript" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ForgeExtensions" />
    <meta
      property="og:description"
      content="List of extensions for ForgeScript."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <h1>ForgeExtensions</h1>
        <p class="sub">Extensions for ForgeScript</p>
      </header>

      <div class="controls">
        <div class="search-wrap">
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input
            id="search"
            type="text"
            placeholder="Search…"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div class="sort-wrap">
          <select id="sort">
            <option value="name-asc">Name A → Z</option>
            <option value="name-desc">Name Z → A</option>
            <option value="type-asc">Official first</option>
            <option value="type-desc">Unlisted first</option>
          </select>
          <svg
            width="11"
            height="11"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </div>
      </div>

      <div class="filters">
        <button class="pill active" data-type="all">All</button>
        <button class="pill" data-type="official">Official</button>
        <button class="pill" data-type="community">Community</button>
        <button class="pill" data-type="unlisted">Unlisted</button>
      </div>

      <div id="count-display"></div>

      <div id="extensions">
        <div id="empty">No extensions match your search.</div>
      </div>

      <footer>
        <a href="https://github.com/ForjSkript">ForjSkript</a> ·
        <a href="https://github.com/ForjSkript/ForgeExtensions"
          >ForgeExtensions</a
        >
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
